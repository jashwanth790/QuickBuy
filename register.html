<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — QuickBuy Smart Shopping</title>
  <meta name="description" content="Create a new QuickBuy account to enjoy personalized smart picks, express checkout, and persistent cart & wishlist.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons 1.11.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Floating Navigation -->
  <header class="position-absolute top-0 start-0 end-0 p-3 p-md-4 z-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="btn btn-sm btn-outline-purple d-inline-flex align-items-center gap-2">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Store</span>
      </a>

      <!-- Theme Toggle Button -->
      <button class="nav-icon-btn" id="themeToggleBtn" title="Toggle Theme" aria-label="Toggle Theme">
        <i class="bi bi-moon-stars-fill text-purple" id="themeToggleIcon"></i>
      </button>
    </div>
  </header>

  <!-- Main Authentication Wrapper -->
  <main class="auth-wrapper">
    <div class="hero-glow-1"></div>
    <div class="hero-glow-2"></div>

    <div class="auth-card auth-card-wide">
      <!-- Brand Logo -->
      <div class="text-center mb-4">
        <a href="index.html" class="auth-brand-logo">
          <span class="brand-icon-box">
            <i class="bi bi-bag-check-fill"></i>
          </span>
          <span>Quick<span class="text-purple">Buy</span></span>
        </a>
        <h3 class="fw-bold mb-1">Create an Account</h3>
        <p class="text-muted small">Join QuickBuy for personalized recommendations & faster checkout</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        <!-- Alert feedback -->
        <div id="registerAlertBox" class="d-none alert alert-danger py-2 px-3 small mb-3"></div>

        <!-- Full Name -->
        <div class="mb-3">
          <label for="regName" class="form-label">Full Name</label>
          <div class="auth-input-group">
            <i class="bi bi-person auth-input-icon"></i>
            <input type="text" class="form-control auth-input" id="regName" placeholder="e.g. Varshith Kumar" required autocomplete="name">
          </div>
        </div>

        <!-- Email Address -->
        <div class="mb-3">
          <label for="regEmail" class="form-label">Email Address</label>
          <div class="auth-input-group">
            <i class="bi bi-envelope auth-input-icon"></i>
            <input type="email" class="form-control auth-input" id="regEmail" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="regPassword" class="form-label">Password</label>
          <div class="auth-input-group">
            <i class="bi bi-lock auth-input-icon"></i>
            <input type="password" class="form-control auth-input pe-5" id="regPassword" placeholder="Minimum 6 characters" required autocomplete="new-password">
            <button type="button" class="auth-password-toggle" id="toggleRegPasswordBtn" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="toggleRegPasswordIcon"></i>
            </button>
          </div>
          <!-- Live Strength Meter -->
          <div class="password-strength-bar">
            <div id="passwordStrengthFill" class="password-strength-fill"></div>
          </div>
          <div class="d-flex justify-content-between small text-muted mt-1" style="font-size: 0.75rem;">
            <span>Strength: <strong id="passwordStrengthLabel">None</strong></span>
            <span>At least 6 characters</span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <div class="auth-input-group">
            <i class="bi bi-shield-lock auth-input-icon"></i>
            <input type="password" class="form-control auth-input" id="regConfirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
          <div id="passwordMatchFeedback" class="small mt-1" style="font-size: 0.75rem;"></div>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="agreeTermsCheckbox" required>
          <label class="form-check-label small text-muted" for="agreeTermsCheckbox">
            I agree to the <a href="javascript:void(0)" class="text-purple">Terms of Service</a> and <a href="javascript:void(0)" class="text-purple">Privacy Policy</a>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-purple w-100 py-2 fw-bold mb-3 shadow-sm" id="submitRegisterBtn">
          <i class="bi bi-person-check-fill me-1"></i> Complete Registration
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">already have an account?</div>

      <!-- Login Link -->
      <div class="text-center">
        <a href="login.html" class="btn btn-outline-purple w-100 py-2 fw-bold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Existing Account
        </a>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <!-- Bootstrap 5.3.3 Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Register Logic Script -->
  <script>
    // Theme initialization
    const savedTheme = localStorage.getItem("quickbuy_theme");
    const systemPrefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    let currentTheme = savedTheme ? savedTheme : (systemPrefersDark ? "dark" : "light");
    document.documentElement.setAttribute("data-bs-theme", currentTheme);

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeIcon = document.getElementById("themeToggleIcon");
    if (themeIcon) {
      themeIcon.className = currentTheme === "dark" ? "bi bi-sun-fill text-warning" : "bi bi-moon-stars-fill text-purple";
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        currentTheme = currentTheme === "light" ? "dark" : "light";
        localStorage.setItem("quickbuy_theme", currentTheme);
        document.documentElement.setAttribute("data-bs-theme", currentTheme);
        if (themeIcon) {
          themeIcon.className = currentTheme === "dark" ? "bi bi-sun-fill text-warning" : "bi bi-moon-stars-fill text-purple";
        }
      });
    }

    // Toast helper
    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;
      const borderClass = type === "success" ? "border-success text-success" : type === "danger" ? "border-danger text-danger" : "border-purple text-purple";
      const iconClass = type === "success" ? "bi-check-circle-fill text-success" : type === "danger" ? "bi-exclamation-octagon-fill text-danger" : "bi-info-circle-fill text-purple";
      
      const toastEl = document.createElement("div");
      toastEl.className = `toast align-items-center custom-toast ${borderClass} border-2 show mb-2`;
      toastEl.innerHTML = `
        <div class="d-flex">
          <div class="toast-body d-flex align-items-center gap-2">
            <i class="bi ${iconClass} fs-5"></i>
            <span>${message}</span>
          </div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      container.appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.remove("show");
        setTimeout(() => toastEl.remove(), 300);
      }, 3500);
    }

    // Toggle Password Visibility
    const toggleRegPasswordBtn = document.getElementById("toggleRegPasswordBtn");
    const regPasswordInput = document.getElementById("regPassword");
    const toggleRegPasswordIcon = document.getElementById("toggleRegPasswordIcon");

    if (toggleRegPasswordBtn && regPasswordInput && toggleRegPasswordIcon) {
      toggleRegPasswordBtn.addEventListener("click", () => {
        const isPassword = regPasswordInput.getAttribute("type") === "password";
        regPasswordInput.setAttribute("type", isPassword ? "text" : "password");
        toggleRegPasswordIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
      });
    }

    // Live Password Strength Meter
    const strengthFill = document.getElementById("passwordStrengthFill");
    const strengthLabel = document.getElementById("passwordStrengthLabel");

    regPasswordInput.addEventListener("input", (e) => {
      const val = e.target.value;
      if (!val) {
        strengthFill.style.width = "0%";
        strengthLabel.textContent = "None";
        strengthLabel.className = "text-muted";
        return;
      }

      let score = 0;
      if (val.length >= 6) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val) || val.length >= 10) score++;

      if (score === 1) {
        strengthFill.style.width = "33%";
        strengthFill.className = "password-strength-fill bg-danger";
        strengthLabel.textContent = "Weak";
        strengthLabel.className = "text-danger fw-bold";
      } else if (score === 2) {
        strengthFill.style.width = "66%";
        strengthFill.className = "password-strength-fill bg-warning";
        strengthLabel.textContent = "Medium";
        strengthLabel.className = "text-warning fw-bold";
      } else {
        strengthFill.style.width = "100%";
        strengthFill.className = "password-strength-fill bg-success";
        strengthLabel.textContent = "Strong";
        strengthLabel.className = "text-success fw-bold";
      }
    });

    // Live Password Confirmation Check
    const regConfirmInput = document.getElementById("regConfirmPassword");
    const matchFeedback = document.getElementById("passwordMatchFeedback");

    function checkPasswordMatch() {
      const pwd = regPasswordInput.value;
      const confirm = regConfirmInput.value;

      if (!confirm) {
        matchFeedback.innerHTML = "";
        return;
      }

      if (pwd === confirm) {
        matchFeedback.innerHTML = '<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i> Passwords match!</span>';
      } else {
        matchFeedback.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle-fill me-1"></i> Passwords do not match</span>';
      }
    }

    regPasswordInput.addEventListener("input", checkPasswordMatch);
    regConfirmInput.addEventListener("input", checkPasswordMatch);

    // Handle Form Submit
    const registerForm = document.getElementById("registerForm");
    const alertBox = document.getElementById("registerAlertBox");

    registerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      alertBox.classList.add("d-none");

      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const password = regPasswordInput.value;
      const confirmPassword = regConfirmInput.value;
      const agreeTerms = document.getElementById("agreeTermsCheckbox").checked;

      // Validation
      if (!name || name.length < 2) {
        alertBox.textContent = "Please provide your full name (at least 2 characters).";
        alertBox.classList.remove("d-none");
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        alertBox.textContent = "Please provide a valid email address.";
        alertBox.classList.remove("d-none");
        return;
      }

      if (password.length < 6) {
        alertBox.textContent = "Password must be at least 6 characters long.";
        alertBox.classList.remove("d-none");
        return;
      }

      if (password !== confirmPassword) {
        alertBox.textContent = "Passwords do not match. Please verify.";
        alertBox.classList.remove("d-none");
        return;
      }

      if (!agreeTerms) {
        alertBox.textContent = "You must agree to the Terms of Service to register.";
        alertBox.classList.remove("d-none");
        return;
      }

      // Check if user already exists
      const users = JSON.parse(localStorage.getItem("quickbuy_users")) || [];
      const userExists = users.some(u => u.email.toLowerCase() === email) || email === "student@quickbuy.demo";

      if (userExists) {
        alertBox.textContent = "An account with this email address already exists. Please sign in.";
        alertBox.classList.remove("d-none");
        showToast("Email already registered.", "warning");
        return;
      }

      // Save new user
      const newUser = {
        name: name,
        email: email,
        password: password,
        registeredAt: new Date().toISOString()
      };

      users.push(newUser);
      localStorage.setItem("quickbuy_users", JSON.stringify(users));

      // Auto login
      localStorage.setItem("quickbuy_current_user", JSON.stringify({
        name: newUser.name,
        email: newUser.email,
        loggedInAt: new Date().toISOString()
      }));

      showToast(`Account created successfully! Welcome, ${newUser.name}!`, "success");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1200);
    });
  </script>
</body>
</html>
